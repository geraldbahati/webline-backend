name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/webline-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/webline-backend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/webline-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/webline-backend:buildcache,mode=max

  terraform:
    name: Prepare Infrastructure
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          cat > .env << EOF
          # Database Configuration
          POSTGRES_USER=${{ secrets.DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.DB_NAME }}
          DB_HOST=db
          DB_PORT=5432
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          PORT=8080

          # AWS S3
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}

          # MPESA
          BUSINESS_SHORTCODE=${{ secrets.BUSINESS_SHORTCODE }}
          PASSKEY=${{ secrets.PASSKEY }}
          CALLBACK_URL=${{ secrets.CALLBACK_URL }}
          CONSUMER_KEY=${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET=${{ secrets.CONSUMER_SECRET }}
          ACCOUNT_REFERENCE=${{ secrets.ACCOUNT_REFERENCE }}

          # SMTP
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL=${{ secrets.FROM_EMAIL }}
          FROM_NAME=${{ secrets.FROM_NAME }}
          TO_EMAIL=${{ secrets.TO_EMAIL }}

          # URLs
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}

          # REDIS
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_DB=0
          REDIS_POOL_SIZE=20
          REDIS_MIN_IDLE_CONNS=5
          REDIS_TTL=15m
          REDIS_RATE_LIMIT=50

          # JWT
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_VERIFY_SECRET=${{ secrets.JWT_VERIFY_SECRET }}
          JWT_GUEST_SECRET=${{ secrets.JWT_GUEST_SECRET }}

          # Environment
          ENV=production

          # Add allowed origins (comma-separated)
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}

          # Docker configuration for CI/CD
          DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
          IMAGE_TAG=${{ github.sha }}
          EOF

      - name: Create Terraform Directory
        run: mkdir -p terraform

      - name: Create SSH Key Directory
        run: mkdir -p /home/runner/.ssh

      - name: Create SSH Key File
        run: |
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > /home/runner/.ssh/id_rsa
          chmod 600 /home/runner/.ssh/id_rsa
          ls -la /home/runner/.ssh/

      - name: Create Terraform Files
        run: |
          cat > terraform/main.tf << 'EOF'
          terraform {
            required_providers {
              digitalocean = {
                source = "digitalocean/digitalocean"
                version = "~> 2.0"
              }
            }
          }

          provider "digitalocean" {
            token = var.do_token
          }

          # Use the existing droplet
          resource "digitalocean_droplet" "app" {
            count    = 1
            image    = "docker-20-04"
            name     = "webline-backend"
            region   = "nyc3"
            size     = "s-1vcpu-2gb"
            ssh_keys = [var.ssh_key_id]

            connection {
              host        = self.ipv4_address
              user        = "root"
              type        = "ssh"
              private_key = file(var.pvt_key)
              timeout     = "2m"
            }

            provisioner "remote-exec" {
              inline = [
                "export PATH=$PATH:/usr/bin",
                "mkdir -p /root/app",
                "mkdir -p /root/app/env"
              ]
            }

            provisioner "file" {
              source      = "docker-compose.yml"
              destination = "/root/app/docker-compose.yml"
            }

            provisioner "file" {
              source      = ".env"
              destination = "/root/app/.env"
            }

            provisioner "remote-exec" {
              inline = [
                "cd /root/app",
                "docker-compose pull",
                "docker-compose up -d"
              ]
            }
          }

          output "app_url" {
            value = digitalocean_droplet.app[0].ipv4_address
          }
          EOF

          cat > terraform/variables.tf << 'EOF'
          variable "do_token" {
            description = "DigitalOcean API token"
            type        = string
            sensitive   = true
          }

          variable "ssh_key_id" {
            description = "SSH key ID in Digital Ocean (numeric)"
            type        = string
          }

          variable "pvt_key" {
            description = "Path to private key file"
            type        = string
            default     = "/home/runner/.ssh/id_rsa"
          }

          variable "docker_hub_username" {
            description = "Docker Hub username"
            type        = string
          }

          variable "image_tag" {
            description = "Docker image tag to deploy"
            type        = string
            default     = "latest"
          }
          EOF

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var "do_token=${{ secrets.DO_TOKEN }}" \
            -var "ssh_key_id=${{ secrets.DO_SSH_KEY_ID }}" \
            -var "docker_hub_username=${{ secrets.DOCKER_HUB_USERNAME }}" \
            -var "image_tag=${{ steps.vars.outputs.sha_short }}"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var "do_token=${{ secrets.DO_TOKEN }}" \
            -var "ssh_key_id=${{ secrets.DO_SSH_KEY_ID }}" \
            -var "docker_hub_username=${{ secrets.DOCKER_HUB_USERNAME }}" \
            -var "image_tag=${{ steps.vars.outputs.sha_short }}"

      - name: Get Deployment IP
        id: get_ip
        working-directory: terraform
        run: |
          IP=$(terraform output -raw app_url)
          echo "deployment_ip=$IP" >> $GITHUB_OUTPUT

      - name: Wait for Health Check
        run: |
          echo "Waiting for the deployment to stabilize..."
          sleep 60
          MAX_RETRIES=10
          COUNTER=0
          until $(curl --output /dev/null --silent --fail http://${{ steps.get_ip.outputs.deployment_ip }}:8080/health); do
            if [ ${COUNTER} -eq ${MAX_RETRIES} ]; then
              echo "Max retries reached. Health check failed."
              exit 1
            fi
            echo "Health check failed. Retrying in 10 seconds..."
            sleep 10
            let COUNTER=COUNTER+1
          done
          echo "Health check passed!"
