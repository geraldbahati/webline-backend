name: CI/CD Pipeline (Test Version)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for better versioning

      - name: Set up QEMU
        if: github.event_name != 'local-test'
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        if: github.event_name != 'local-test'
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      # Local test mock steps
      - name: Mock QEMU and Buildx setup (for local testing)
        if: github.event_name == 'local-test'
        run: |
          echo "Mocking QEMU and Docker Buildx setup for local testing"
          echo "These steps would set up cross-platform building capabilities in the real workflow"

      - name: Login to Docker Hub
        if: github.event_name != 'local-test'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/webline-backend
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # For local testing, mock the build step
      - name: Mock Docker build (for local testing)
        if: github.event_name == 'local-test'
        run: |
          echo "Mocking Docker build and push step for local testing"
          echo "Would build image: ${{ secrets.DOCKER_HUB_USERNAME }}/webline-backend"
          echo "With tags: ${{ steps.meta.outputs.tags }}"
          echo "For platforms: linux/amd64,linux/arm64"

      - name: Build and Push Docker Image
        if: github.event_name != 'local-test'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'local-test' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/webline-backend:buildcache
          cache-to: ${{ github.event_name != 'local-test' && 'type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/webline-backend:buildcache,mode=max' || '' }}
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.sha }}

  deploy:
    name: Deploy to Server (Test)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          cat > .env << EOF
          # Database Configuration
          POSTGRES_USER=${{ secrets.DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.DB_NAME }}
          DB_HOST=db
          DB_PORT=5432
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          PORT=8080

          # AWS S3
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}

          # MPESA
          BUSINESS_SHORTCODE=${{ secrets.BUSINESS_SHORTCODE }}
          PASSKEY=${{ secrets.PASSKEY }}
          CALLBACK_URL=${{ secrets.CALLBACK_URL }}
          CONSUMER_KEY=${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET=${{ secrets.CONSUMER_SECRET }}
          ACCOUNT_REFERENCE=${{ secrets.ACCOUNT_REFERENCE }}

          # SMTP
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL=${{ secrets.FROM_EMAIL }}
          FROM_NAME=${{ secrets.FROM_NAME }}
          TO_EMAIL=${{ secrets.TO_EMAIL }}

          # URLs
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}

          # REDIS
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_DB=0
          REDIS_POOL_SIZE=20
          REDIS_MIN_IDLE_CONNS=5
          REDIS_TTL=15m
          REDIS_RATE_LIMIT=50

          # JWT
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_VERIFY_SECRET=${{ secrets.JWT_VERIFY_SECRET }}
          JWT_GUEST_SECRET=${{ secrets.JWT_GUEST_SECRET }}

          # Environment
          ENV=production

          # Add allowed origins (comma-separated)
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}

          # Docker configuration for CI/CD
          DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
          IMAGE_TAG=${{ github.sha }}
          EOF

      # For local testing, we'll use a mock SSH setup
      - name: Mock SSH deployment (for local testing)
        if: github.event_name == 'local-test'
        run: |
          echo "Simulating SSH deployment for local testing..."
          mkdir -p ~/app_mock_deploy
          cp docker-compose.yml ~/app_mock_deploy/
          cp .env ~/app_mock_deploy/
          echo "Mock deployment completed successfully."

      # For actual deployment, use the real SSH setup
      - name: Set up SSH key
        if: github.event_name != 'local-test'
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: Add host key to known hosts
        if: github.event_name != 'local-test'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 209.97.128.72 >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        id: deploy
        if: github.event_name != 'local-test'
        run: |
          export DROPLET_IP="209.97.128.72"
          export SSH_USER="gerald-bahati"

          # Create directories
          ssh ${SSH_USER}@${DROPLET_IP} "mkdir -p ~/app/backups"

          # Create backup script
          ssh ${SSH_USER}@${DROPLET_IP} "cat > ~/app/backup-before-deploy.sh << 'EOF'
          #!/bin/bash
          timestamp=\$(date +%Y%m%d_%H%M%S)
          mkdir -p ~/app/backups
          if [ -f ~/app/docker-compose.yml ]; then
            cd ~/app
            sudo docker compose ps -q | xargs -r sudo docker inspect --format='{{.Name}}' | while read container; do
              echo \"Backing up state for \$container\"
              sudo docker inspect \$container > ~/app/backups/\${container##*/}_\${timestamp}.json
            done
            cp ~/app/docker-compose.yml ~/app/backups/docker-compose_\${timestamp}.yml
            cp ~/app/.env ~/app/backups/.env_\${timestamp}
          fi
          EOF"

          # Make backup script executable
          ssh ${SSH_USER}@${DROPLET_IP} "chmod +x ~/app/backup-before-deploy.sh"

          # Run backup before deployment
          ssh ${SSH_USER}@${DROPLET_IP} "~/app/backup-before-deploy.sh"

          # Copy files
          scp docker-compose.yml ${SSH_USER}@${DROPLET_IP}:~/app/
          scp .env ${SSH_USER}@${DROPLET_IP}:~/app/

          # Deploy with improved error handling
          ssh ${SSH_USER}@${DROPLET_IP} "cd ~/app && sudo docker compose pull && sudo docker compose up -d" || {
            echo "Deployment failed. Checking container logs..."
            ssh ${SSH_USER}@${DROPLET_IP} "cd ~/app && echo 'Container Logs:' && sudo docker compose logs"
            exit 1
          }

          echo "Checking container status..."
          ssh ${SSH_USER}@${DROPLET_IP} "cd ~/app && sudo docker compose ps"

          echo "Deployment completed successfully."

      - name: Mock Health Check (for local testing)
        if: github.event_name == 'local-test'
        run: |
          echo "Simulating health check for local testing..."
          echo "Health check passed! Application is up and running."

      - name: Wait for Health Check
        if: github.event_name != 'local-test'
        run: |
          export DROPLET_IP="209.97.128.72"
          echo "Waiting for the deployment to stabilize..."
          sleep 30

          MAX_RETRIES=15
          COUNTER=0
          HEALTH_URL="http://${DROPLET_IP}:8080/health"

          echo "Checking health endpoint: ${HEALTH_URL}"

          until curl --output /dev/null --silent --fail --max-time 10 "${HEALTH_URL}"; do
            if [ ${COUNTER} -eq ${MAX_RETRIES} ]; then
              echo "Max retries reached. Health check failed."
              echo "Checking container logs for troubleshooting..."
              ssh gerald-bahati@${DROPLET_IP} "cd ~/app && sudo docker compose logs --tail=100"
              exit 1
            fi
            echo "Health check attempt ${COUNTER}/${MAX_RETRIES} failed. Retrying in 10 seconds..."
            sleep 10
            let COUNTER=COUNTER+1
          done

          echo "Health check passed! Application is up and running."
